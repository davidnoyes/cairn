<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Cairn</title>
<style>
  :root{
    --bg:#f2efe8; --panel:#fbf9f4; --ink:#28231b; --muted:#82796a;
    --line:#ddd5c6; --accent:#a4502a; --accent-soft:#a4502a1a; --danger:#8d2f23;
    --ok:#4a6b43;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16130f; --panel:#1e1a15; --ink:#eae3d4; --muted:#8f8676;
           --line:#38322a; --accent:#cf7040; --accent-soft:#cf704022; --danger:#c9564a;
           --ok:#7f9c76; }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--serif); min-height:100svh}
  header{
    display:flex; align-items:center; gap:1rem; padding:.8rem 1.4rem;
    background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .mark svg{width:1.5rem; height:auto; display:block}
  .stone{fill:var(--ink)}
  .word{font-size:1.2rem; font-weight:600; margin:0}
  nav{display:flex; gap:.25rem; margin-left:1.5rem}
  nav button{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    background:none; border:0; color:var(--muted); padding:.5rem .8rem; cursor:pointer;
    border-radius:.35rem;
  }
  nav button.active{color:var(--accent); background:var(--accent-soft)}
  .spacer{flex:1}
  .chip{font-family:var(--mono); font-size:.72rem; color:var(--muted)}
  .chip a{color:var(--accent)}
  main{max-width:64rem; margin:0 auto; padding:2rem 1.4rem 5rem}
  section{display:none}
  section.active{display:block}
  h2{font-size:1.5rem; margin:0 0 .25rem}
  .hint{color:var(--muted); font-size:.9rem; margin:0 0 1.5rem}
  table{width:100%; border-collapse:collapse; background:var(--panel);
        border:1px solid var(--line); border-radius:.5rem; overflow:hidden}
  th{
    font-family:var(--mono); font-size:.65rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); text-align:left; padding:.6rem .8rem; border-bottom:1px solid var(--line);
    background:var(--accent-soft);
  }
  td{padding:.55rem .8rem; border-bottom:1px solid var(--line); font-size:.92rem; vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.mono, .mono{font-family:var(--mono); font-size:.78rem}
  td .sub{color:var(--muted); font-size:.8rem}
  .pill{font-family:var(--mono); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase;
        padding:.15rem .5rem; border-radius:1rem; border:1px solid var(--line)}
  .pill.public{color:var(--ok); border-color:var(--ok)}
  .pill.admin{color:var(--accent); border-color:var(--accent)}
  .pill.off{color:var(--danger); border-color:var(--danger)}
  .actions{display:flex; gap:.4rem; justify-content:flex-end; flex-wrap:wrap}
  .btn{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; cursor:pointer;
    padding:.32rem .6rem; border-radius:.35rem; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); text-decoration:none; white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger)}
  .btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .btn.primary:hover{background:var(--accent); border-color:var(--accent); color:#fff}
  form.bar{
    display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:.5rem;
    padding:.8rem; margin:1.25rem 0 0;
  }
  form.bar input, form.bar select{
    padding:.5rem .6rem; font-family:var(--mono); font-size:.8rem;
    background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:.35rem;
  }
  form.bar label{font-family:var(--mono); font-size:.7rem; color:var(--muted);
                 display:flex; align-items:center; gap:.35rem}
  .flash{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-family:var(--mono); font-size:.78rem;
    padding:.6rem 1rem; border-radius:.4rem; max-width:min(40rem, 90vw);
    word-break:break-all; display:none; box-shadow:0 .5rem 2rem rgb(0 0 0 / .35);
  }
  .versions td{background:var(--accent-soft)}
  .empty{color:var(--muted); font-style:italic; padding:1rem}
</style>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 60">
        <rect class="stone" x="20" y="2"  width="24" height="12" rx="6"/>
        <rect class="stone" x="14" y="18" width="36" height="13" rx="6.5"/>
        <rect class="stone" x="6"  y="35" width="52" height="15" rx="7.5"/>
      </svg>
    </span>
    <h1 class="word">Cairn</h1>
    <nav>
      <button data-tab="artifacts" class="active">Artifacts</button>
      <button data-tab="users">Users</button>
      <button data-tab="keys">API keys</button>
    </nav>
    <span class="spacer"></span>
    <span class="chip" id="who"></span>
    <span class="chip"><a href="/logout">sign out</a></span>
  </header>

  <main>
    <section id="artifacts" class="active">
      <h2>Artifacts</h2>
      <p class="hint">Everything hosted by this server. Click a name to open the shared view.</p>
      <div id="artifactList"></div>
    </section>

    <section id="users">
      <h2>Users</h2>
      <p class="hint">New accounts have no password — the user chooses one at first sign-in.</p>
      <div id="userList"></div>
      <form class="bar" id="userForm">
        <input name="email" type="email" placeholder="email" required>
        <input name="name" placeholder="name">
        <label><input name="isAdmin" type="checkbox"> admin</label>
        <button class="btn primary">Create user</button>
      </form>
    </section>

    <section id="keys">
      <h2>API keys</h2>
      <p class="hint">Keys authenticate as their user. The token is shown once at creation.</p>
      <div id="keyList"></div>
      <form class="bar" id="keyForm">
        <select name="userId" id="keyUser"></select>
        <input name="name" placeholder="key name (e.g. claude-cli)">
        <button class="btn primary">Create key</button>
      </form>
    </section>
  </main>

  <div class="flash" id="flash"></div>

<script>
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => [...(el || document).querySelectorAll(s)];

  async function api(path, options) {
    const resp = await fetch(path, options);
    if (resp.status === 401) { location.href = '/login?next=/admin'; throw new Error('unauthenticated'); }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    return data;
  }
  const post = (p, body) => api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const patch = (p, body) => api(p, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const del = (p) => api(p, {method:'DELETE'});

  let flashTimer;
  function flash(msg, sticky) {
    const el = $('#flash');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(flashTimer);
    if (!sticky) flashTimer = setTimeout(() => el.style.display = 'none', 4000);
  }
  function fail(err) { flash('✗ ' + err.message); }

  // Tabs
  $$('nav button').forEach(btn => btn.addEventListener('click', () => {
    $$('nav button').forEach(b => b.classList.toggle('active', b === btn));
    $$('main section').forEach(s => s.classList.toggle('active', s.id === btn.dataset.tab));
  }));

  const td = (content, cls) => {
    const el = document.createElement('td');
    if (cls) el.className = cls;
    if (content instanceof Node) el.appendChild(content); else el.textContent = content;
    return el;
  };
  const btn = (label, cls, fn) => {
    const el = document.createElement('button');
    el.className = 'btn ' + (cls || '');
    el.textContent = label;
    el.addEventListener('click', fn);
    return el;
  };
  const pill = (label, cls) => {
    const el = document.createElement('span');
    el.className = 'pill ' + (cls || '');
    el.textContent = label;
    return el;
  };
  function table(headers) {
    const t = document.createElement('table');
    const tr = document.createElement('tr');
    headers.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      tr.appendChild(th);
    });
    t.appendChild(tr);
    return t;
  }

  // ------------------------------------------------------------- artifacts
  async function loadArtifacts() {
    const box = $('#artifactList');
    const artifacts = await api('/api/artifacts');
    box.innerHTML = '';
    if (!artifacts.length) { box.innerHTML = '<p class="empty">No artifacts yet — push one with the CLI.</p>'; return; }
    const t = table(['name', 'id', 'visibility', 'updated', '']);
    for (const a of artifacts) {
      const tr = document.createElement('tr');
      const name = document.createElement('div');
      const link = document.createElement('a');
      link.href = '/shared/' + a.id; link.target = '_blank';
      link.textContent = a.name; link.style.color = 'var(--accent)';
      name.appendChild(link);
      if (a.description) {
        const d = document.createElement('div');
        d.className = 'sub'; d.textContent = a.description;
        name.appendChild(d);
      }
      tr.appendChild(td(name));
      tr.appendChild(td(a.id, 'mono'));
      tr.appendChild(td(pill(a.public ? 'public' : 'private', a.public ? 'public' : '')));
      tr.appendChild(td((a.updatedAt || '').slice(0, 10), 'mono'));
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.append(
        btn('versions', '', () => toggleVersions(tr, a)),
        btn(a.public ? 'make private' : 'make public', '', async () => {
          try { await patch('/api/artifacts/' + a.id, {public: !a.public}); loadArtifacts(); } catch (e) { fail(e); }
        }),
        btn('delete', 'danger', async () => {
          if (!confirm('Delete artifact "' + a.name + '" and all its versions and data?')) return;
          try { await del('/api/artifacts/' + a.id); flash('artifact deleted'); loadArtifacts(); } catch (e) { fail(e); }
        }),
      );
      tr.appendChild(td(actions));
      t.appendChild(tr);
    }
    box.appendChild(t);
  }

  async function toggleVersions(row, artifact) {
    const existing = row.parentElement.querySelector('tr.versions[data-for="' + artifact.id + '"]');
    if (existing) { existing.remove(); return; }
    const versions = await api('/api/artifacts/' + artifact.id + '/versions');
    const tr = document.createElement('tr');
    tr.className = 'versions';
    tr.dataset.for = artifact.id;
    const cell = document.createElement('td');
    cell.colSpan = 5;
    if (!versions.length) cell.innerHTML = '<span class="empty">no versions</span>';
    for (const v of versions) {
      const line = document.createElement('div');
      line.className = 'mono';
      line.style.padding = '.15rem 0';
      const open = document.createElement('a');
      open.href = '/artifacts/' + artifact.id + '/' + v.id + '/';
      open.target = '_blank';
      open.style.color = 'var(--accent)';
      open.textContent = '#' + v.seq;
      line.append(open, document.createTextNode(
        '  ' + v.id + '  ' + (v.name || '—') + '  ' + (v.createdAt || '').slice(0, 16).replace('T', ' ') +
        (v.changelog ? '  · ' + v.changelog : '')));
      const rm = btn('delete', 'danger', async () => {
        if (!confirm('Delete version #' + v.seq + ' and its database?')) return;
        try { await del('/api/artifacts/' + artifact.id + '/versions/' + v.id); tr.remove(); flash('version deleted'); } catch (e) { fail(e); }
      });
      rm.style.marginLeft = '.6rem';
      line.appendChild(rm);
      cell.appendChild(line);
    }
    tr.appendChild(cell);
    row.after(tr);
  }

  // ----------------------------------------------------------------- users
  async function loadUsers() {
    const box = $('#userList');
    const users = await api('/api/admin/users');
    box.innerHTML = '';
    const t = table(['user', 'id', 'status', '']);
    for (const u of users) {
      const tr = document.createElement('tr');
      const who = document.createElement('div');
      who.textContent = u.email;
      if (u.name) { const d = document.createElement('div'); d.className = 'sub'; d.textContent = u.name; who.appendChild(d); }
      tr.appendChild(td(who));
      tr.appendChild(td(u.id, 'mono'));
      const status = document.createElement('div');
      status.style.display = 'flex'; status.style.gap = '.3rem';
      if (u.isAdmin) status.appendChild(pill('admin', 'admin'));
      if (u.disabled) status.appendChild(pill('disabled', 'off'));
      tr.appendChild(td(status));
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.append(
        btn(u.isAdmin ? 'revoke admin' : 'make admin', '', async () => {
          try { await patch('/api/admin/users/' + u.id, {isAdmin: !u.isAdmin}); loadUsers(); } catch (e) { fail(e); }
        }),
        btn(u.disabled ? 'enable' : 'disable', '', async () => {
          try { await patch('/api/admin/users/' + u.id, {disabled: !u.disabled}); loadUsers(); } catch (e) { fail(e); }
        }),
        btn('reset password', '', async () => {
          if (!confirm('Reset password for ' + u.email + '? They will choose a new one at next sign-in.')) return;
          try { await post('/api/admin/users/' + u.id + '/reset-password', {}); flash('password reset — next sign-in sets a new one'); } catch (e) { fail(e); }
        }),
        btn('delete', 'danger', async () => {
          if (!confirm('Delete ' + u.email + '?')) return;
          try { await del('/api/admin/users/' + u.id); loadUsers(); } catch (e) { fail(e); }
        }),
      );
      tr.appendChild(td(actions));
      t.appendChild(tr);
    }
    box.appendChild(t);
  }

  $('#userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      await post('/api/admin/users', {
        email: f.email.value.trim(),
        name: f.name.value.trim(),
        isAdmin: f.isAdmin.checked,
      });
      f.reset();
      flash('user created — they set a password at first sign-in');
      loadUsers();
    } catch (err) { fail(err); }
  });

  // ------------------------------------------------------------------ keys
  async function loadKeys() {
    const box = $('#keyList');
    const [keys, users] = await Promise.all([api('/api/admin/keys'), api('/api/admin/users')]);
    const byId = Object.fromEntries(users.map(u => [u.id, u]));
    const sel = $('#keyUser');
    sel.innerHTML = '';
    for (const u of users) {
      const opt = document.createElement('option');
      opt.value = u.id; opt.textContent = u.email;
      sel.appendChild(opt);
    }
    box.innerHTML = '';
    if (!keys.length) { box.innerHTML = '<p class="empty">No API keys yet.</p>'; return; }
    const t = table(['key', 'user', 'created', 'status', '']);
    for (const k of keys) {
      const tr = document.createElement('tr');
      const label = document.createElement('div');
      label.textContent = k.name || '(unnamed)';
      const idLine = document.createElement('div');
      idLine.className = 'sub mono'; idLine.textContent = 'cairn_' + k.id + '_…';
      label.appendChild(idLine);
      tr.appendChild(td(label));
      tr.appendChild(td((byId[k.userId] || {}).email || k.userId, 'mono'));
      tr.appendChild(td((k.createdAt || '').slice(0, 10), 'mono'));
      tr.appendChild(td(k.revokedAt ? pill('revoked', 'off') : pill('active', 'public')));
      const actions = document.createElement('div');
      actions.className = 'actions';
      if (!k.revokedAt) {
        actions.appendChild(btn('revoke', 'danger', async () => {
          if (!confirm('Revoke this key?')) return;
          try { await del('/api/admin/keys/' + k.id); loadKeys(); } catch (e) { fail(e); }
        }));
      }
      tr.appendChild(td(actions));
      t.appendChild(tr);
    }
    box.appendChild(t);
  }

  $('#keyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      const out = await post('/api/admin/keys', {userId: f.userId.value, name: f.name.value.trim()});
      f.name.value = '';
      flash('token (copy now, shown once): ' + out.token, true);
      loadKeys();
    } catch (err) { fail(err); }
  });

  // ------------------------------------------------------------------ init
  (async () => {
    try {
      const me = await api('/api/me');
      $('#who').textContent = me.email;
      await Promise.all([loadArtifacts(), loadUsers(), loadKeys()]);
    } catch (e) { /* redirected to login */ }
  })();
</script>
</body>
</html>
