<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/shell.css">
</head>
<body data-artifact="{{.ID}}" data-version="{{.Version}}" data-path="{{.Path}}" data-mode="{{.Mode}}" data-content-origin="{{.ContentOrigin}}">
  <header>
    <a class="mark" href="/" title="home" aria-label="Cairn home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="11" y="7"  width="10" height="4" rx="2" fill="#C6F135"/>
        <rect x="8"  y="14" width="16" height="4" rx="2" fill="#C6F135" opacity=".7"/>
        <rect x="5"  y="21" width="22" height="4" rx="2" fill="#C6F135" opacity=".45"/>
      </svg>
    </a>
    <h1 id="name" class="name"></h1>
    <p id="desc" class="desc"></p>
    <span class="spacer"></span>
    <label class="chip" for="version">version</label>
    <select id="version"></select>
    <a id="fullscreen" class="btn">full screen</a>
    {{if .User}}<a id="account" href="/">{{if .User.Name}}{{.User.Name}}{{else}}{{.User.Email}}{{end}}</a>
    {{else}}<a id="account" href="/login?next=/shared/{{.ID}}">sign in</a>{{end}}
  </header>
  <p id="status" role="status" hidden></p>
  <div id="frame-host"></div>
  <script type="module" src="/shell.mjs"></script>
</body>
</html>
