<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password · Cairn</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="wrap">
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect x="11" y="7"  width="10" height="4" rx="2" fill="#C6F135"/>
        <rect x="8"  y="14" width="16" height="4" rx="2" fill="#C6F135" opacity=".7"/>
        <rect x="5"  y="21" width="22" height="4" rx="2" fill="#C6F135" opacity=".45"/>
      </svg>
    </div>
    <h1>cairn</h1>
    <p class="sub">reset your password</p>
    <form id="form" method="dialog" autocomplete="on">
      <p class="text">Enter your email address. If it has an account, we send a link that works for 30 minutes.</p>
      <label for="email">email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <button type="submit" id="submit" disabled>Send the link</button>
      <p class="error" id="error" role="alert" hidden></p>
      <div class="links"><a href="/login">Back to sign in</a></div>
    </form>
    <section id="sent" hidden>
      <p class="ok-text" id="message" role="status"></p>
      <div class="links"><a href="/login">Back to sign in</a></div>
    </section>
  </main>
  </div>
  <script type="module" src="/forgot.js"></script>
</body>
</html>
