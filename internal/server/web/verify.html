<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify your email · Cairn</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="wrap">
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect x="11" y="7"  width="10" height="4" rx="2" fill="#C6F135"/>
        <rect x="8"  y="14" width="16" height="4" rx="2" fill="#C6F135" opacity=".7"/>
        <rect x="5"  y="21" width="22" height="4" rx="2" fill="#C6F135" opacity=".45"/>
      </svg>
    </div>
    <h1>cairn</h1>
    <p class="sub">verify your email</p>
    <p class="text" id="working" aria-live="polite">Verifying your address…</p>
    <p class="ok-text" id="ok" role="status" hidden>Your email is verified.</p>
    <p class="error" id="error" role="alert" hidden></p>
    <div class="links"><a href="/login" id="signin" hidden>Sign in</a><a href="/signup" id="again" hidden>Sign up again</a></div>
  </main>
  </div>
  <script type="module" src="/verify.js"></script>
</body>
</html>
