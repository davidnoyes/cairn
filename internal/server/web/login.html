<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Cairn</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body data-next="{{.Next}}" data-google="{{if .Google}}1{{end}}" data-error="{{.Error}}">
  <div class="wrap">
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <rect x="11" y="7"  width="10" height="4" rx="2" fill="#C6F135"/>
        <rect x="8"  y="14" width="16" height="4" rx="2" fill="#C6F135" opacity=".7"/>
        <rect x="5"  y="21" width="22" height="4" rx="2" fill="#C6F135" opacity=".45"/>
      </svg>
    </div>
    <h1>cairn</h1>
    <p class="sub">artifact server</p>
    <section id="google" hidden>
      <p class="text">This server signs you in with your Google Account first.</p>
      <a class="button" id="google-start" href="/auth/google">Continue with Google</a>
    </section>
    <form id="form" method="dialog" autocomplete="on">
      <p class="text" id="google-who" hidden>Signed in with Google as <strong id="google-email"></strong>. Now unlock your keys.</p>
      <label for="email">email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submit" disabled>Sign in</button>
      <button type="button" class="secondary" id="passkey" hidden disabled>Sign in with a passkey</button>
      <div class="links" id="google-switch" hidden><a id="google-again" href="/auth/google">Use another Google Account</a></div>
      <div class="links"><a href="/signup">Create an account</a><a href="/forgot">Forgot your password?</a></div>
    </form>
    <p class="error" id="error" role="alert" hidden></p>
  </main>
  </div>
  <script type="module" src="/login.js"></script>
</body>
</html>
