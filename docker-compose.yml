# Run Cairn from the prebuilt image. Works as-is with `docker compose up -d`
# and with hosted Docker managers (Hostinger, Portainer, ...). All state lives
# in the cairn-data volume.
services:
  cairn:
    image: ghcr.io/aloisdeniel/cairn:latest
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - cairn-data:/data
    environment:
      # Bootstrap admin — read only on first boot, while the user table is empty.
      CAIRN_ADMIN_EMAIL: ${CAIRN_ADMIN_EMAIL:-admin@example.com}
      CAIRN_ADMIN_PASSWORD: ${CAIRN_ADMIN_PASSWORD:-change-me-now}
      # Set to your https:// URL once behind TLS so cookies are marked Secure.
      CAIRN_BASE_URL: ${CAIRN_BASE_URL:-}

volumes:
  cairn-data:
