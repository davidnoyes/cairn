## Lints and tests every push and pull request: Go, the embedded browser
## JavaScript, and the end-to-end smoke test against a built binary.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Tests must never reach a real server.
      CAIRN_HOST: ""
      CAIRN_API_KEY: ""
    steps:
      # Full history, so the e2e test can build the pre-encryption server
      # from the commit it archives.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: argon2 wasm is reproducible
        run: |
          ./scripts/build-argon2-wasm.sh
          git diff --exit-code internal/server/web/vendor/

      - name: go test
        run: |
          go test -race -timeout 30m -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1
          go test -tags e2eclock ./cmd/cairn -run TestE2EClock

      - name: npm ci
        run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: node test
        run: node --test --experimental-test-coverage internal/server/web/*_test.mjs

      - name: e2e
        run: ./scripts/e2e.sh

  # Slower checks for milestone and integration branches only: every fuzz
  # test for 60 seconds, and the mutation list in scripts/mutations.txt,
  # split into shards that run in parallel.
  fuzz:
    if: startsWith(github.ref_name, 'e2e/') || github.ref_name == 'feat/e2e-trust-model'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAIRN_HOST: ""
      CAIRN_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: fuzz
        run: ./scripts/fuzz.sh

  mutations:
    if: startsWith(github.ref_name, 'e2e/') || github.ref_name == 'feat/e2e-trust-model'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CAIRN_HOST: ""
      CAIRN_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: mutations
        run: MUTATE_SHARD=${{ matrix.shard }}/8 ./scripts/mutate.sh

  # Browser end-to-end suite on all three engines, for milestone and
  # integration branches only: it is written ahead of the feature it tests.
  browser:
    if: startsWith(github.ref_name, 'e2e/') || github.ref_name == 'feat/e2e-trust-model'
    runs-on: ubuntu-latest
    env:
      CAIRN_HOST: ""
      CAIRN_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: playwright
        run: npx playwright test
      - name: keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
