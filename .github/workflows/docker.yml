## Builds and pushes the multi-arch Docker image to GHCR when a v* tag is
## pushed. workflow_dispatch backfills an existing tag (e.g. v1.0). Only a
## commit on main is built. The image embeds the release manifest, signed
## with the CAIRN_RELEASE_KEY secret, and is itself signed keyless with
## cosign, which the VM's startup script checks (deploy/gcp/startup.sh).
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v1.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # cosign's keyless signing certificate

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Refuse a commit that is not on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Sign the release manifest
        env:
          CAIRN_RELEASE_KEY: ${{ secrets.CAIRN_RELEASE_KEY }}
        run: |
          if [ -z "$CAIRN_RELEASE_KEY" ]; then
            echo "::error::the CAIRN_RELEASE_KEY secret is not set; see deploy/gcp/README.md"
            exit 1
          fi
          go run ./cmd/cairn-release sign -version "$TAG"
      - name: Check the build serves its manifest, under its compiled-in key
        run: |
          go build -o "$RUNNER_TEMP/cairn" ./cmd/cairn
          "$RUNNER_TEMP/cairn" serve --addr 127.0.0.1:8790 --data-dir "$RUNNER_TEMP/data" \
            --admin-email ci@example.com --smtp-url log:// --public-url http://127.0.0.1:8790 &
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:8790/healthz >/dev/null && break; sleep 0.2; done
          "$RUNNER_TEMP/cairn" verify --allow-skip --version "$TAG" http://127.0.0.1:8790
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
