## Builds and pushes the multi-arch Docker image to GHCR when a v* tag is
## pushed. workflow_dispatch backfills an existing tag (e.g. v1.0). Only a
## commit on main is built. The image embeds the release manifest, signed
## with the CAIRN_RELEASE_KEY secret, and is itself signed keyless with
## cosign, which the VM's startup script checks (deploy/gcp/startup.sh).
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v1.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # cosign's keyless signing certificate

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Refuse a commit that is not on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Sign the release manifest
        env:
          CAIRN_RELEASE_KEY: ${{ secrets.CAIRN_RELEASE_KEY }}
        run: |
          if [ -z "$CAIRN_RELEASE_KEY" ]; then
            echo "::error::the CAIRN_RELEASE_KEY secret is not set; see deploy/gcp/README.md"
            exit 1
          fi
          go run ./cmd/cairn-release sign -version "$TAG"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
