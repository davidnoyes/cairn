## Builds release binaries when a v* tag is pushed and attaches them to the
## GitHub release, named as docs/install.sh expects: cairn-<os>-<arch>.tar.gz
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w" -o dist/cairn ./cmd/cairn
              tar -czf "dist/cairn-$os-$arch.tar.gz" -C dist cairn
              rm dist/cairn
            done
          done
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
