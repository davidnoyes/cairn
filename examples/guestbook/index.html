<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook</title>
<style>
  :root{
    --bg:#f5f1e8; --ink:#2b2418; --muted:#8a7f6a; --line:#ded5c2;
    --accent:#37618d; --card:#fdfbf6;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141210; --ink:#e9e2d2; --muted:#8d8574; --line:#37322a;
           --accent:#7ea4ce; --card:#1d1a16; }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--serif);
       max-width:38rem; padding:3rem 1.25rem 5rem; margin-inline:auto}
  h1{font-size:2.2rem; margin:0}
  .status{font-family:var(--mono); font-size:.7rem; letter-spacing:.15em;
          text-transform:uppercase; color:var(--muted); margin:.4rem 0 2.5rem}
  .status b{color:var(--accent)}
  form{display:flex; gap:.6rem; margin-bottom:2rem}
  input{flex:1; padding:.7rem .8rem; font-size:1rem; font-family:inherit;
        background:var(--card); color:inherit; border:1px solid var(--line); border-radius:.4rem}
  button{padding:.7rem 1.1rem; font-family:var(--mono); font-size:.8rem; cursor:pointer;
         letter-spacing:.1em; text-transform:uppercase;
         background:var(--accent); color:#fff; border:0; border-radius:.4rem}
  .entry{background:var(--card); border:1px solid var(--line); border-radius:.5rem;
         padding:.9rem 1rem; margin-bottom:.7rem}
  .entry p{margin:0 0 .4rem; font-size:1.05rem}
  .entry footer{font-family:var(--mono); font-size:.68rem; color:var(--muted)}
  .empty{color:var(--muted); font-style:italic}
</style>
</head>
<body>
  <h1>Guestbook</h1>
  <p class="status">mode <b id="mode">…</b> · signed in as <b id="who">…</b></p>
  <form id="form">
    <input id="message" placeholder="Leave a note…" maxlength="280" required>
    <button>Sign</button>
  </form>
  <div id="entries"><p class="empty">Loading…</p></div>

<script src="./cairn.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  async function refresh() {
    const res = await cairn.db.query(
      'SELECT message, author, created_at FROM entries ORDER BY id DESC LIMIT 50');
    const box = $('entries');
    box.innerHTML = '';
    if (!res.rows.length) {
      box.innerHTML = '<p class="empty">No entries yet — be the first.</p>';
      return;
    }
    for (const [message, author, at] of res.rows) {
      const el = document.createElement('article');
      el.className = 'entry';
      const p = document.createElement('p');
      p.textContent = message;
      const f = document.createElement('footer');
      f.textContent = `${author} · ${(at || '').slice(0, 16).replace('T', ' ')}`;
      el.append(p, f);
      box.appendChild(el);
    }
  }

  async function main() {
    $('mode').textContent = cairn.mode;
    await cairn.ready();
    // Run-once schema setup, safe under concurrent viewers.
    await cairn.db.migrate('001-entries', [{
      sql: `CREATE TABLE entries (
              id INTEGER PRIMARY KEY,
              message TEXT NOT NULL,
              author TEXT NOT NULL,
              created_at TEXT NOT NULL)`
    }]);
    const me = await cairn.me();
    $('who').textContent = me ? (me.name || me.email) : 'anonymous (read-only)';

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!me) { cairn.login(); return; }
      const message = $('message').value.trim();
      if (!message) return;
      await cairn.db.query(
        'INSERT INTO entries (message, author, created_at) VALUES (?, ?, ?)',
        [message, me.name || me.email, new Date().toISOString()]);
      $('message').value = '';
      await refresh();
    });
    await refresh();
  }
  main().catch((err) => {
    $('entries').innerHTML = '<p class="empty">' + err.message + '</p>';
  });
</script>
</body>
</html>
